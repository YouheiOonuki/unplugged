<body class="try-page">

  <header class="app-header">
    <h1>ロボットを うごかして たしかめる</h1>
  </header>

  <main class="app-main">
    <div class="try-top">
      <span id="try-info"></span>
      <a id="to-print" href="./">印刷・設定へ</a>
    </div>

    <div class="try-board" id="board-box"></div>
    <div class="palette" id="palette" role="group" aria-label="カード"></div>

    <div class="prog-box" id="prog-box" aria-live="polite"><output class="small" id="prog-empty">上の カードを おして ならべよう</output></div>
    <p class="prog-count" id="prog-count"></p>

    <div class="run-row">
      <button type="button" class="btn" id="run">うごかす ▶</button>
      <button type="button" class="btn btn-sub" id="undo">1つ けす</button>
      <button type="button" class="btn btn-sub" id="clear">ぜんぶ けす</button>
    </div>
    <p class="try-result" id="result" role="status"></p>
    <p class="try-rule" id="try-rule"></p>

    <details class="card opt" id="opt-next">
      <summary>べつの もんだい: <span class="opt-state"></span></summary>
      <div class="field">
        <label for="t-step">ならうこと</label>
        <select id="t-step"><option value="1">じゅんばん</option><option value="2">くりかえし</option><option value="3">もし</option></select>
      </div>
      <div class="field">
        <label for="t-level">むずかしさ</label>
        <select id="t-level"><option value="easy">かんたん 4×4</option><option value="normal">ふつう 5×5</option><option value="hard">むずかしい 6×6</option></select>
      </div>
      <div class="field">
        <label for="t-mode">カード</label>
        <select id="t-mode"><option value="yaji">やじるし</option><option value="muki">まえ・みぎ・ひだり</option></select>
      </div>
      <button type="button" class="btn" id="next">つぎの もんだい</button>
    </details>

    <details class="card opt" id="opt-answer">
      <summary>こたえの れい（先生・おうちの人用）</summary>
      <div id="answer"></div>
      <p class="small">印刷の画面で保存した設定を消すとき（1 秒 長押し）：<br><button type="button" class="btn btn-sub" data-reset-storage="unplugged_" data-reset-hold>保存した内容をすべて消す（初期状態に戻す）</button></p>
    </details>

    <p class="small"><a href="./guide.html">使い方・カードのきまり</a> ／ <a href="./jugyou.html">授業の流れ</a></p>
  </main>
